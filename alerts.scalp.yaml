# Scalping PRACTICE alerts: RSI dip buying on 15-minute candles, checked every 5 minutes.
# Every alert says PRACTICE. In testing (20 markets) this rule lost about 31% a year at Coinbase/Fomo fees
# (~0.6% per buy or sell) and only broke even with near-zero fees, so don't use real money with it.
# Each SELL alert shows a running practice score (after 0.6% fees) so you can see how it's doing.
# On GitHub the "scalp" workflow runs this all day; on your computer: python -m bot alerts --settings alerts.scalp.yaml
notify:                 # same channel as alerts.yaml (ALERT_TARGET secret or my_alert_channel.txt)
every_minutes: 5

lists:
  - name: Scalping practice (RSI dip, 15m)
    config: config.daytrade.yaml
    watchlist: watchlist.scalp.txt
    stake: 800
    practice: true

  - name: Young coins (dip bounce, 5m)
    config: config.young.yaml        # hours-old coins: buy sharp dips, sell at the average, 20% stop-loss
    watchlist: watchlist.young.txt   # coins added after a chart check (sol:<contract address>)
    stake: 30
    practice_account: false          # real alerts for your lottery money, not part of the $800 practice scalper

# Practice auto-trading for the scalping list: its own fake-money account (see alerts.yaml).
practice_trading:
  enabled: true
  cash: 8000            # room for 10 trades open at once
  per_trade: 800
  file: practice_account_scalp_800.json
