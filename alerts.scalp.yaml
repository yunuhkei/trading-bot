# Scalping PRACTICE bot (fake money): RSI dip scalping on 5-minute candles, checked every 5 minutes, aiming for a
# trade every 10-15 minutes across the watchlist. It LEARNS: every 3 hours it re-studies the last week of prices and
# adjusts its own settings (bot/scalp_learn.py). Instead of a ping per trade, your phone gets a report every hour of
# what it bought and sold, the account, and anything it learned.
# Warning: in testing (last week, 20 markets) every setting lost about 1.2% per trade after the 0.6% app fee on each
# buy and sell, because 5-minute moves are usually smaller than the fees. Don't copy it with real money.
# On GitHub the "scalp" workflow runs this all day; on your computer: python -m bot alerts --settings alerts.scalp.yaml
notify:                 # same channel as alerts.yaml (ALERT_TARGET secret or my_alert_channel.txt)
every_minutes: 5
report_every_minutes: 60  # the scalp report: what the practice bot did (skipped in an hour it did nothing)

lists:
  - name: Scalping practice (RSI dip, 5m, self-tuning)
    config: config.scalp.yaml
    watchlist: watchlist.scalp.txt
    stake: 800
    practice: true
    alert_each_trade: false          # no ping per trade: the hourly report covers them
    learn:
      every_hours: 3                 # re-study the last week and adjust the settings this often
      min_trades_per_hour: 4         # only pick settings that trade at least this often (about every 15 minutes)
      file: scalp_learned.json

  - name: Young coins (dip bounce, 5m)
    config: config.young.yaml        # hours-old coins: buy sharp dips, sell at the average, 20% stop-loss
    watchlist: watchlist.young.txt   # coins added after a chart check (sol:<contract address>)
    stake: 30
    practice_account: false          # real alerts for your lottery money, not part of the $800 practice scalper

# Practice auto-trading for the scalping list: its own fake-money account (see alerts.yaml).
practice_trading:
  enabled: true
  cash: 8000            # room for 10 trades open at once
  per_trade: 800
  file: practice_account_scalp_800.json
