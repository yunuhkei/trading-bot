# The most robust setup found by `optimize` on Coinbase BTC-USD daily data, 2015-2026.
# Own Bitcoin while the price is >2% above its 200-day average; sell when it's >2% below.
# Typically 1-3 trades a year. It mainly cuts the size of crashes; in strong bull years it
# usually makes LESS than simply holding. Paper trade it first.
exchange: coinbase
symbol: BTC/USD
market_type: spot
timeframe: 1d
strategy: trend
strategy_params:
  period: 200
  band: 0.02
allow_short: false        # shorting made this strategy worse in testing
starting_cash: 10000
fee_pct: 0.006
slippage_pct: 0.0005
risk:
  position_pct: 0.95
  stop_loss_pct: 0.0      # the trend rule is the exit; stops only added whipsaw in testing
  take_profit_pct: 0.0
  max_drawdown_pct: 0.0   # Bitcoin often drops 50%+, so any tighter emergency stop shut this
                          # strategy off for good in testing. Only put in money you can watch halve.
mode: paper
poll_seconds: 300
state_file: state.json
trade_log: trades.csv
