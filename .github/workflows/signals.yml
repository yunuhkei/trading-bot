# Checks your alert lists (alerts.yaml: 200-day trend filter + meme-coin breakout) every hour on GitHub's
# computers, free for personal accounts, and sends alerts when a signal changes. Setup: HOW_TO_USE.md / the guide.
name: signals
on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      test_alert:
        description: "Only send a test alert to your phone"
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Remember the last signals between runs, so you only get alerted when one changes.
      - uses: actions/cache/restore@v4
        with:
          path: |
            signals_state_*.json
            news_ideas_state.json
            practice_account.json
          key: signals-state-${{ github.run_id }}
          restore-keys: signals-state-
      - name: Send a test alert
        if: ${{ inputs.test_alert }}
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
        run: python -m bot alerts --test-alert ${ALERT_TARGET:+--notify "$ALERT_TARGET"}
      - name: Check signals
        if: ${{ !inputs.test_alert }}
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}   # optional: overrides `notify` in alerts.yaml
        run: python -m bot alerts --once ${ALERT_TARGET:+--notify "$ALERT_TARGET"}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            signals_state_*.json
            news_ideas_state.json
            practice_account.json
          key: signals-state-${{ github.run_id }}
