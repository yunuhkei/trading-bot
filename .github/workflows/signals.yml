# Checks buy/sell signals every hour on GitHub's computers (free for personal accounts) and sends
# alerts to your phone when a signal changes. Setup: see HOW_TO_USE.md, "Buy/sell alerts on your phone".
name: signals
on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07
  workflow_dispatch:         # lets you run it by hand from the Actions tab
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Remember the last signals between runs, so you only get alerted when one changes.
      - uses: actions/cache/restore@v4
        with:
          path: signals_state.json
          key: signals-state-${{ github.run_id }}
          restore-keys: signals-state-
      - name: Check signals
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
          MARKETS: ${{ vars.MARKETS || 'BTC-USD,ETH-USD,SOL-USD,SPY,QQQ' }}
          CONFIG: ${{ vars.CONFIG || 'config.trend.yaml' }}
        run: python -m bot -c "$CONFIG" signals --markets "$MARKETS" ${ALERT_TARGET:+--notify "$ALERT_TARGET"}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: signals_state.json
          key: signals-state-${{ github.run_id }}
