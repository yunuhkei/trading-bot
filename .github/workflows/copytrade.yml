# Copy-trader (bot/copytrade.py): watches the smart wallets (models/smart_wallets.json) live and copies their buys and
# sells within seconds: pretend money for all of them, and real money (the SOLANA_BOT_KEY wallet) for the approved ones
# (solbot.yaml copytrade:). One long job of almost 6 hours, then the next one takes over. Needs the HELIUS_API_KEY secret.
name: copytrade
on:
  # Off (Nov 11 2026): practice only since Nov 9, and the wallet it copied stopped trading Nov 6.
  # To turn it back on, uncomment the two lines below.
  # schedule:
  #   - cron: "*/30 * * * *"   # starts a new job if none is running; waits its turn otherwise
  workflow_dispatch:
concurrency:
  group: copytrade
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: copytrade_state.json
          key: copytrade-state-${{ github.run_id }}
          restore-keys: copytrade-state-
      - uses: actions/cache/restore@v4
        with:
          path: copytrade_state_live.json
          key: copytrade-live-${{ github.run_id }}
          restore-keys: copytrade-live-
      - name: Copy the smart wallets
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_BOT_KEY: ${{ secrets.SOLANA_BOT_KEY }}
        # Pull new commits every 5 minutes (a new smart-wallet list applies on the next 30-minute round).
        run: |
          (while sleep 300; do git pull -q --ff-only origin main || true; done) &
          python -m bot copytrade --minutes 340
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: copytrade_state.json
          key: copytrade-state-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('copytrade_state_live.json') != ''
        with:
          path: copytrade_state_live.json
          key: copytrade-live-${{ github.run_id }}
