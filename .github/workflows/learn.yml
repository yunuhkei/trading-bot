# Every day: add the newest prices to data/ (including the Fomo coins on your watchlist), let the bot tune its
# strategies and relearn which signals tend to win, and save what it learned (models/). Alerts and chart checks use it
# right away, and your phone gets a message whenever it changes a strategy. Run it by hand from the Actions tab.
name: learn
on:
  schedule:
    - cron: "23 9 * * *"      # every day, 09:23 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Add the newest prices, tune and relearn
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
        run: python -m bot learn --refresh --notify-changes
      - name: Save what it learned
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models data
          if ! git diff --cached --quiet; then
            git commit -q -m "Weekly learning: newest prices and retrained models"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
