# Prints the copy-trader's saved records (practice and real money) from its last finished run: results, open coins,
# dropped wallets, low-balance pause. Reads only; trades nothing and uses no keys. Run it by hand from the Actions tab.
name: copytrade-status
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: copytrade_state.json
          key: copytrade-state-status-${{ github.run_id }}
          restore-keys: copytrade-state-
      - uses: actions/cache/restore@v4
        with:
          path: copytrade_state_live.json
          key: copytrade-live-status-${{ github.run_id }}
          restore-keys: copytrade-live-
      - name: Show the records
        run: python -m bot copytrade --status
