# Scalping PRACTICE bot (alerts.scalp.yaml): one long job that checks every 5 minutes for almost 6 hours, then the
# next one takes over, so checks run all day. It re-learns its settings every 3 hours and sends an hourly report.
# Free on public repositories.
name: scalp
on:
  # Off (Nov 3 2026): both lists in alerts.scalp.yaml are switched off; the Solana bot (solbot.yml) trades the young
  # coins. To turn it back on, uncomment the schedule below.
  # schedule:
  #   - cron: "*/30 * * * *"   # starts a new job if none is running; waits its turn otherwise
  workflow_dispatch:
concurrency:
  group: scalp
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Remember signals, the practice account and what it learned between jobs.
      - uses: actions/cache/restore@v4
        with:
          path: |
            signals_state_scalping*.json
            signals_state_young*.json
            practice_account_scalp*.json
            scalp_learned.json
          key: scalp-state-${{ github.run_id }}
          restore-keys: scalp-state-
      - name: Check every 5 minutes
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
        # Pull new commits every 5 minutes so coins added to a watchlist are checked without restarting the job.
        run: |
          (while sleep 300; do git pull -q --ff-only origin main || true; done) &
          python -m bot alerts --settings alerts.scalp.yaml --minutes 340 ${ALERT_TARGET:+--notify "$ALERT_TARGET"}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            signals_state_scalping*.json
            signals_state_young*.json
            practice_account_scalp*.json
            scalp_learned.json
          key: scalp-state-${{ github.run_id }}
