# Launch lab (bot/launch_lab.py): PRACTICE only, pretend money. Watches every pump.fun coin live through Solana's free
# public feed (no keys), builds 1-second charts and runs 9 short-term strategies side by side, each with its own
# pretend $1,000 and $250 trades, with honest delays, curve price impact and fees. One long job of almost 6 hours,
# then the next; the results carry over. Your phone gets the scoreboard when each job ends.
name: launch-lab
on:
  schedule:
    - cron: "*/30 * * * *"   # starts a new job if none is running; waits its turn otherwise
  workflow_dispatch:
    inputs:
      first_report:
        description: "Send an early report this many minutes in (blank = just the hourly ones)"
        default: ""
      resume_super:
        description: "Type yes to put the super bot back on its money after practice mode (your check said go)"
        default: ""
concurrency:
  group: launch-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: launch_lab_state.json
          key: launch-lab-${{ github.run_id }}
          restore-keys: launch-lab-
      # the super bot's research log (daily files, pruned after 3-5 weeks): its own cache, apart from the lab's state
      - uses: actions/cache/restore@v4
        with:
          path: lab_data
          key: lab-data-${{ github.run_id }}
          restore-keys: lab-data-
      - name: Watch pump.fun and practice-trade
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}   # quotes only (the fast buyer practices; nothing is sent)
          SOLANA_BOT_KEY: ${{ secrets.SOLANA_BOT_KEY }}     # the sniper's wallet: it trades only when sniper.yaml says live
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}     # sends the sniper's trades
          FIRST_REPORT: ${{ inputs.first_report }}
          RESUME_SUPER: ${{ inputs.resume_super }}
        # pull new commits every 5 minutes, so a change to sniper.yaml (like live: false) reaches the running lab
        run: |
          mkdir -p lab_data
          (while sleep 300; do git pull -q --ff-only origin main || true; done) &
          python -m bot launch-lab --minutes 340 ${FIRST_REPORT:+--first-report "$FIRST_REPORT"} $( [ "$RESUME_SUPER" = "yes" ] && echo --resume-super )
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: launch_lab_state.json
          key: launch-lab-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: lab_data
          key: lab-data-${{ github.run_id }}
