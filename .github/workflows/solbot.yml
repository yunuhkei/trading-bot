# Solana auto-trader (solbot.yaml): one long job that checks every 5 minutes for almost 6 hours, then the next one
# takes over, so it runs all day. Needs the SOLANA_BOT_KEY secret (the bot's own wallet) for live mode.
# Remembers its trades between jobs; saves young-coin list changes and solbot_stopped.json (pauses/stops) to the repo.
name: solbot
on:
  # Off (Nov 11 2026): stopped by its own -50% limit since Nov 4, set to real money, and the wallet is empty.
  # To turn it back on, uncomment the two lines below.
  # schedule:
  #   - cron: "*/30 * * * *"   # starts a new job if none is running; waits its turn otherwise
  workflow_dispatch:
concurrency:
  group: solbot
  cancel-in-progress: false
permissions:
  contents: write            # to save the young-coin list when it adds/drops coins, and solbot_stopped.json
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: solbot_state_*.json
          key: solbot-state-${{ github.run_id }}
          restore-keys: solbot-state-
      - name: Trade every 5 minutes
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
          SOLANA_BOT_KEY: ${{ secrets.SOLANA_BOT_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLBOT_COMMIT: "1"   # save list changes and stops to the repo
        # Pull new commits every 5 minutes, so settings changes (like switching to live) and new coins apply right away.
        run: |
          (while sleep 300; do git pull -q --ff-only origin main || true; done) &
          python -m bot solbot --minutes 340
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: solbot_state_*.json
          key: solbot-state-${{ github.run_id }}
