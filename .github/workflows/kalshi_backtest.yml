# Backtest the Kalshi weather strategies on settled markets (bot/kalshi_backtest.py). Run it by hand:
# Actions -> kalshi-backtest -> Run workflow. The result goes to your phone and the log.
name: kalshi-backtest
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past days to test"
        default: "14"
      sameday:
        description: "Same-day test instead (station readings + day-of prices for the saved city-days): yes / no"
        default: "no"
      walkforward:
        description: "Walk-forward test of ideas to improve the main strategy instead: yes / no"
        default: "no"
permissions:
  contents: write            # saves the data and the per-city forecast corrections (models/kalshi_priors.json)
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
        run: |
          if [ "${{ inputs.walkforward }}" = "yes" ]; then
            python -m bot kalshi-backtest --walkforward
          elif [ "${{ inputs.sameday }}" = "yes" ]; then
            python -m bot kalshi-backtest --sameday
          else
            python -m bot kalshi-backtest --days "${{ inputs.days || '14' }}"
          fi
      - name: Save the data and what it measured
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_*.json models/kalshi_priors.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Kalshi backtest: saved settled city-days and what it measured"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
