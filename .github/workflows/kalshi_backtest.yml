# Backtest the Kalshi weather strategies on settled markets (bot/kalshi_backtest.py). Run it by hand:
# Actions -> kalshi-backtest -> Run workflow. The result goes to your phone and the log.
name: kalshi-backtest
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past days to test"
        default: "14"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest
        env:
          ALERT_TARGET: ${{ secrets.ALERT_TARGET }}
        run: python -m bot kalshi-backtest --days "${{ inputs.days || '14' }}"
