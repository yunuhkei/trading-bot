<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Racer Prototype</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
#gl,#hud{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#load{position:fixed;inset:0;background:#0a0d14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;transition:opacity .5s}
#load.off{opacity:0;pointer-events:none}
#load h1{margin:0;font-size:22px;letter-spacing:.2em;font-weight:800;text-transform:uppercase}
#load .bar{width:min(70vw,360px);height:6px;background:#1c2330;border-radius:3px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#ffc23d);transition:width .15s}
#load p{margin:0;font-size:13px;opacity:.7;min-height:1.2em}
#go{display:none;margin-top:6px;padding:12px 34px;border-radius:26px;border:0;background:#ff7a1a;color:#111;font-weight:800;font-size:16px;letter-spacing:.12em}
#rot{display:none;position:fixed;inset:0;z-index:8;background:#0a0d14;color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;font-weight:700}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
#tips{font-size:12px;line-height:1.5;opacity:.65;text-align:center;max-width:min(80vw,420px)}
#err{position:fixed;left:8px;right:8px;top:8px;z-index:9;background:rgba(120,0,0,.9);padding:8px 10px;border-radius:8px;font:12px/1.35 monospace;white-space:pre-wrap;display:none;max-height:45vh;overflow:auto;pointer-events:auto;-webkit-user-select:text;user-select:text}
</style></head><body>
<canvas id="gl"></canvas><canvas id="hud"></canvas>
<div id="load"><h1>Racer prototype</h1><div class="bar"><i id="lb"></i></div><p id="lt">Starting…</p><button id="go">DRIVE</button><div id="tips">Left thumb: drag to steer &middot; Right: GAS and BRAKE pedals, DRIFT above brake, NITRO above gas &middot; Tap the minimap for the world map<br>Keyboard: arrows/WASD, Space drift, Shift nitro, R reset, M map, G auto-gas, F fps, P pause</div></div>
<div id="rot">Turn your phone sideways (landscape) to drive</div>
<div id="err"></div>
<script>
/*SRC*/
</script></body></html>
