# The scalp PRACTICE bot's rule (alerts.scalp.yaml): RSI dip trading on 1-hour candles, long only, fake money.
# Buy when the RSI dips below `low`; sell when it's back above `high`, or up `tp` (take profit), or down `sl` (stop).
# These are only the starting settings: every 3 hours the bot re-studies the last 60 days and adjusts them itself
# (bot/scalp_learn.py, saved in scalp_learned.json). On 5-minute candles it lost about 1.2% per trade at 0.6% app
# fees; on 1-hour candles the best settings were around break-even (1-2 trades a day). Practice only.
exchange: coinbase
symbol: BTC/USD
market_type: spot
timeframe: 1h
strategy: rsi_scalp
strategy_params:
  period: 14
  low: 30
  high: 65
  tp: 0.0
  sl: 0.0
allow_short: false
day_trade: true           # stocks: never hold overnight
starting_cash: 10000
fee_pct: 0.006
slippage_pct: 0.0002
risk:
  position_pct: 0.95
  stop_loss_pct: 0.0
  take_profit_pct: 0.0
  max_drawdown_pct: 0.0
mode: paper
poll_seconds: 60
state_file: state.json
trade_log: trades.csv
