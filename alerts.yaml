# Your alert settings. `python -m bot alerts` (or double-click START_ALERTS) reads this file.
# The bot never trades: it sends BUY / SELL alerts and you place the trades yourself.

notify: ntfy:tbot-00dcc1a84c   # your private ntfy channel (Part 1 of the guide)
every_minutes: 60              # how often to check

lists:
  - name: Main (200-day trend filter)
    config: config.trend.yaml        # best overall strategy in testing
    watchlist: watchlist.main.txt

  - name: Meme coins (20-day breakout)
    config: config.memes.yaml        # best meme-coin strategy in testing
    watchlist: watchlist.memes.txt   # add Fomo coins here as sol:<contract address>
    stake: 30                        # alerts say "BUY $30 of ..."
