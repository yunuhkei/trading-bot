# Solana auto-trader (bot/solbot.py): buys dips with the dip-bounce rule from a wallet that belongs to the bot alone.
# Checked every 5 minutes by the "solbot" workflow on GitHub. Every buy and sell (or would-be one) goes to your phone.
# Setup: a new wallet (e.g. Phantom) with only the money for the bot as USDC on Solana + ~0.03 SOL for network fees;
# its private key goes in the SOLANA_BOT_KEY GitHub secret (see HOW_TO_USE.md).
mode: live                # off | dry_run (real quotes, pretend money, no trades) | live (real trades)

# --- Money: account = the bot's own money (its budget, plus or minus what its trades made) + what it holds ---
budget: 30                # the bot only ever uses this much of the wallet's USDC (plus its winnings); ask Claude to raise it
tiers:                    # dollars per trade, by account size
  - {below: 100, per_trade: 30}
  - {below: 200, per_trade: 50}
  - {below: 250, per_trade: 75}
  - {per_trade: 100}      # from $250 up: keeps auto-trading, no more pauses
pause_at: [100, 200]      # when the account first reaches these: sell everything, stop and tell you (ask Claude to continue)
stop_below: 10            # account at or below this: sell everything and stop
stop_drawdown: 0.5        # account down this much from its best: sell everything and stop (protects the bigger amounts)
stop_loss: 0.20           # sell a coin or stock if it's down this much from the buy
max_cost: 0.03            # skip a buy if fees + price impact would be more than this (3%)

# --- Safety (rug pulls, crashes, falling knives) ---
max_holder_pct: 20        # rug check before every buy (RugCheck): skip if one wallet owns more than 20%,
max_top10_pct: 50         # or the top 10 own more than 50%, or the creator can print/freeze coins, or it's flagged
liquidity_drop: 0.30      # sell a coin at once if its pool loses 30% of its money while the bot holds it
guard_seconds: 30         # check the stop-loss and pool money of what it holds every 30 seconds
max_drop_6h: 0.10         # no buys while a coin is a falling knife (down 10%+ in 6 hours): doubled profit per trade in testing
market_drop_1h: 0.03      # no coin buys while SOL itself is down 3%+ in the last hour
min_up_24h: 0.20          # only buy a dip if the coin is up 20%+ over the last 24 h (a strong uptrend): on 21 young coins,
                          # dips bought in falling or barely-rising coins lost; it would have skipped 4 of the first 5 real
                          # trades. The practice account still takes every signal, so the Thursday report compares both.
start_cash: 30            # dry run only: the pretend starting money

# --- Practice account next to the live bot: same coins and strategies, pretend money, takes EVERY signal ---
practice:                 # so there's data on every coin even while the real budget can only hold one trade at a time
  enabled: true
  cash: 300               # enough for 10 trades at once
  per_trade: 30
  report_at: "15:00"      # no ping per pretend trade: one report (real bot + practice, per coin) on payday at 3 pm
  report_days: [Thursday]
  timezone: America/Chicago   # Milwaukee
flush:                    # a 2nd pretend account on the same coins: the sharp-drop buy, to compare with the real bot (Nov 17)
  enabled: true           # tested on 21 young coins (7 days, 1% fees): ~70% of trades won, held up on coins it hadn't seen
  cash: 300
  per_trade: 30
  drop: 0.20              # buy right after the price falls 20%...
  minutes: 30             # ...within 30 minutes (no falling-knife filter: it buys the crash on purpose)
  take_profit: 0.12       # sell once it's back up 12% (on the 5-minute close), or...
  hours: 6                # ...after 6 hours, or at the 20% stop-loss. Its trades ping your phone silently (low priority).

# --- Learning (bot/solbot_learn.py) ---
learn: true               # re-test the dip-bounce settings on recent prices; adopt better ones only if they win on unseen days
learn_coins_every_hours: 24
learn_stocks_every_hours: 168
bench_after_losses: 3     # a found coin that loses 3 trades in a row is dropped (not picked again for 2 weeks); never NIO

# --- Strategies per coin (bot/solbot_strats.py): dip bounce, range bounce, RSI dip ---
min_win_rate: 0.81        # a coin keeps its strategy while it wins 81%+ (last 3 days, and the bot's own last trades);
                          # otherwise it switches to one that passes the 81% test, or sits the coin out until one does
review_every_hours: 2
pinned:                   # always on the list, never benched (they switch strategies or sit out instead)
  - sol:7SL2VnfYsChvog5oQY9Nmtqu1wceaMiQzWoqoLQpump   # NIO

# --- Young Solana coins (5-minute chart) ---
watchlist: watchlist.young.txt       # the same list as your young-coin alerts
strategy_config: config.young.yaml
find_coins: true          # every few hours, search for new coins like NIO; add one only if a strategy wins 81%+ on it
scan_every_hours: 2
max_coins: 6              # most coins on the list at once
coin_filters:             # what a new coin must look like
  min_age_hours: 336       # 2+ weeks old: on 28 coins, dips in coins under 2 weeks lost for all 3 strategies (-0.5 to -1.2%
  max_age_days: 60         # a trade), coins 2+ weeks made +0.6% (4+ weeks: +1.2 to +2.3%); most meme coins are dead by then,
  min_liquidity: 50000     # so the ones still trading are calmer
  min_volume_24h: 100000   # older coins trade less than brand-new ones
  min_mcap: 250000
  max_mcap: 50000000
dead_below_liquidity: 20000      # a coin with less than this in its pool...
dead_below_volume_24h: 20000     # ...or less than this traded in a day is dying: sell it and drop it from the list

# --- Stocks (verified xStocks on Solana, daily chart, US market hours only) ---
stocks: false             # off for now. true = also trade xStocks
stock_strategy_config: config.stockdip.yaml
max_price_gap: 0.01       # only trade when the xStock's price is within 1% of the real stock's

# --- Copy-trading the smart wallets (bot/smart_wallets.py finds them weekly; bot/copytrade.py follows them live) ---
copytrade:                # needs the HELIUS_API_KEY secret
  enabled: true
  cash: 300               # pretend money for now
  per_trade: 30
  follow: 30              # how many of the best smart wallets to watch
  alert_wallets: 2        # a normal ping when this many different smart wallets buy the same coin within 6 h
  min_liquidity: 20000    # don't copy into a coin with less than this in its pool (plus the rug check)
  stop_loss: 0.20
  max_hold_hours: 48      # sell after this long even if the wallet hasn't
  live:                   # REAL money from the bot's wallet (SOLANA_BOT_KEY), same rules as above plus these
    enabled: true
    budget: 0             # 0 = trade whatever USDC is in the wallet (a refill counts right away)
    per_trade: 6          # dollars a trade
    max_open: 2           # coins held at once
    max_cost: 0.03        # skip a buy that would cost more than 3% in fees + price impact
    stop_below: 3         # stop buying when the account is under $3 (still sells what it holds)
    drop_after_losses: 4  # stop copying a wallet whose last 4 real copies all lost
    forgive:              # wallets to copy again after a drop (each is forgiven once, with a clean record)
      - 71pAfN1nJhcLaezSRYvwdsNFE9PnY9hNfcxB4nZ1gdAp
